name: Type Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # JOB 1: THE BRAIN (The Sensor)
  # This job identifies which folders were actually modified.
  changes:
    runs-on: ubuntu-latest
    # We export these results so 'backend-check' and 'frontend-check' can read them
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Step 1: Download your code onto the virtual machine
      - uses: actions/checkout@v4

      # Step 2: The "Sensor" logic
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'  # If any file in /backend changes, set backend=true
            frontend:
              - 'frontend/**' # If any file in /frontend changes, set frontend=true

  # JOB 2: THE BACKEND WORKER
  backend-check:
    # Wait for 'changes' job to finish first
    needs: changes
    # ONLY run this job if the "Brain" found changes in the backend folder
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every command in this job will run inside the /backend folder
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # Speeds up future runs by remembering the node_modules
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install & Typecheck
        run: |
          npm ci                # Clean install of exact dependencies
          npx prisma generate   # Create the TS types based on your DB schema
          npx tsc --noEmit      # Run the type check (if false don't create JS files)

  # JOB 3: THE FRONTEND WORKER
  frontend-check:
    # Wait for 'changes' job to finish first
    needs: changes
    # ONLY run this job if the "Brain" found changes in the frontend folder
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every command in this job will run inside the /frontend folder
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install & Typecheck
        run: |
          npm ci
          npx tsc --noEmit      # Check React/Vite code for TS errors
